name: Voorbeeld kaartkleuren
on:
  push:
    branches: [voorbeeld/kaartkleuren]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright installeren
        run: |
          npm init -y >/dev/null
          npm install playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium
      - name: Kaarten renderen
        run: node voorbeeld/render.mjs
      - name: Afbeeldingen publiceren op branch voorbeeld/kaartkleuren-uit
        run: |
          cd uit
          git init -q -b uit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Voorbeeld kaartkleuren"
          git push -q -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git uit:voorbeeld/kaartkleuren-uit
