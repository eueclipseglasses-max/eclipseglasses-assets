# Configuratie om de Worker (het bestand `albeter`) automatisch vanuit GitHub naar Cloudflare te zetten.
# Uitleg: zie DEPLOY.md.

# Naam van de Worker in Cloudflare. Moet exact kloppen, anders weigert de build.
name = "curly-block-7b36"

# `albeter` heeft geen extensie; voor het bouwen kopiëren we het naar build/worker.js.
main = "build/worker.js"
compatibility_date = "2024-09-23"

# Variabelen die in het dashboard staan (geen geheimen) niet overschrijven.
# Geheimen zoals DELIJN_API_KEY en de tweede sleutel blijven sowieso bewaard bij een deploy.
keep_vars = true

# Het domein. Als Custom Domain gekoppeld aan deze Worker.
routes = [{ pattern = "eclipseglasses.eu", custom_domain = true }]

# De workers.dev-link aan laten (anders zet een deploy met een domein ze uit),
# en previewlinks toelaten zodat elke branch/pull request een testversie krijgt.
workers_dev = true
preview_urls = true

# Elke minuut een kleine stap van de import van het netwerk van heel Vlaanderen (lijnen en haltes van De Lijn).
# Is alles bijgewerkt, dan doet de stap niets tot de wekelijkse vernieuwing.
[triggers]
crons = ["* * * * *"]

[build]
command = "mkdir -p build && cp albeter build/worker.js"

# De D1-databank, gekoppeld op ID. De naam is optioneel; zonder naam kan ze niet verkeerd zijn.
[[d1_databases]]
binding = "DB"
database_id = "bfd5d01e-00cc-42af-a95d-e56f0002ec1c"
